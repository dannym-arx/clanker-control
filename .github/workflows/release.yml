name: release

# Build static binaries for Linux, macOS and Windows on every push to main
# (and on version tags), then publish them to a GitHub release.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.out }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            out: clanker-control-linux-x86_64
            # Statically link so the binary runs on any Linux without deps.
            flags: "-extra-linker-flags:-static"
          - os: macos-latest
            out: clanker-control-macos-arm64
            flags: ""
          - os: windows-latest
            out: clanker-control-windows-x86_64.exe
            flags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: latest

      - name: Build
        shell: bash
        run: odin build . -out:${{ matrix.out }} -o:speed ${{ matrix.flags }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          # Version tags publish a normal release; pushes to main keep a rolling
          # "latest" pre-release with the newest binaries.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/*
